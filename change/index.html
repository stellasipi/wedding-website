                        <input type="radio" name="attending" value="Igen">
                        <span data-translate="attending_yes"></span>
                    </label>
                    <label>
                        <input type="radio" name="attending" value="Sajnos nem">
                        <span data-translate="attending_no"></span>
                    </label>
                </div>
                <span class="field-error" id="error-attending"></span>
            </div>
            
            <div id="conditional-fields">
                <div class="form-group">
                    <label data-translate="form_allergies"></label>
                    <div class="allergy-container">
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="allergy_status" value="Nincs">
                                <span data-translate="allergies_none"></span>
                            </label>
                            <label>
                                <input type="radio" name="allergy_status" value="Van">
                                <span data-translate="allergies_have"></span>
                            </label>
                        </div>
                        <div class="allergy-textbox" id="allergy-textbox-container">
                            <input type="text" id="allergies_text" name="allergies_text" data-translate-placeholder="allergies_placeholder">
                        </div>
                    </div>
                    <span class="field-error" id="error-allergies"></span>
                </div>
                
                <div class="form-group">
                    <label data-translate="form_driver"></label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="driver_service" value="Igen">
                            <span data-translate="driver_yes"></span>
                        </label>
                        <label>
                            <input type="radio" name="driver_service" value="Nem">
                            <span data-translate="driver_no"></span>
                        </label>
                        <label>
                            <input type="radio" name="driver_service" value="Még nem tudom">
                            <span data-translate="driver_maybe"></span>
                        </label>
                    </div>
                    <span class="field-error" id="error-driver"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="message" data-translate="form_message"></label>
                <textarea id="message" name="message" data-translate-placeholder="message_placeholder"></textarea>
            </div>
            
            <button type="submit" class="submit-btn" data-translate="submit_btn"></button>
            <div class="form-message" id="formMessage"></div>
        </form>
        <div class="thank-you-panel" id="thankYouPanel">
            <div class="thank-you-icon">✓</div>
            <p class="thank-you-message" id="thankYouMessage"></p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p data-translate="footer"></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
